# Desired state for posthog. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials. The stack has no defaults for any of these: a real
# create fails before the first provider call rather than falling back to a
# value published in this repository. Only the selected compute provider's
# token is required.
#   DigitalOcean    COLORS_PAR_DO_TOKEN         (provider-compute: digitalocean)
#   Vultr           COLORS_PAR_VULTR_API_KEY    (provider-compute: vultr)
#   Cloudflare      COLORS_PAR_CLOUDFLARE_API_TOKEN
#   state in R2     COLORS_PAR_R2_ACCESS_KEY_ID
#                   COLORS_PAR_R2_SECRET_ACCESS_KEY
#   backups in R2   COLORS_PAR_POSTHOG_BACKUP_R2_ACCESS_KEY_ID
#                   COLORS_PAR_POSTHOG_BACKUP_R2_SECRET_ACCESS_KEY
#   application     COLORS_PAR_POSTHOG_SECRET_KEY
#                   COLORS_PAR_POSTHOG_POSTGRES_PASSWORD
#                   COLORS_PAR_POSTHOG_OIDC_RSA_PRIVATE_KEY
#                   COLORS_PAR_POSTHOG_ENCRYPTION_SALT_KEYS
#                   COLORS_PAR_POSTHOG_ADMIN_PASSWORD

profile: posthog-example
workdir: .colors

# digitalocean or vultr. Keys of the unselected provider below are ignored, so
# both blocks can stay. Switching is a rebuild, never an apply: with a machine
# in state, create and delete both refuse until this is set back to the
# recorded provider and the deployment is deleted first.
provider-compute: digitalocean
provider-dns: cloudflare
provider-backend: r2

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- PostHog Stack -----------------------------------------------------------

# The owner account provisioned on every converge; its password is
# COLORS_PAR_POSTHOG_ADMIN_PASSWORD. PostHog's hosted realm only lets the first
# user create an organization, so the deployment owns this account rather than
# leaving it to a signup that may already be impossible.
posthog-admin-email: acceptance@example.invalid

posthog-host: posthog.example.com
# The application and plugin server images must come from one commit: they
# share a Postgres schema, and a floating tag on either side means the node
# process queries columns the application's migrations never created.
posthog-image: posthog/posthog:82ea6681305bb00ad4ca920e3ba6e8fb39157424

posthog-postgres-image: postgres:17-alpine
# Track the version upstream pins. PostHog's schema puts TTLs on DateTime64
# columns, which 24.8 rejects outright.
posthog-clickhouse-image: clickhouse/clickhouse-server:26.6.2.158
posthog-redis-image: redis:7.2-alpine
posthog-plugin-server-image: posthog/posthog-node:82ea6681305bb00ad4ca920e3ba6e8fb39157424
# :master resolved 2026-08-17. A digest is the only pin that cannot move.
posthog-capture-image: ghcr.io/posthog/posthog/capture@sha256:8b07f51be1a8983c4d171b443a58c0deb3ab1e6e15202729cde85c3fa280b3e5
posthog-temporal-image: temporalio/auto-setup:1.26.2
posthog-kafka-image: redpandadata/redpanda:v25.1.9
caddy-image: caddy:2.11.4

posthog-postgres-data-dir: /var/lib/posthog/postgres
posthog-clickhouse-data-dir: /var/lib/posthog/clickhouse
posthog-redis-data-dir: /var/lib/posthog/redis
posthog-kafka-data-dir: /var/lib/posthog/kafka
posthog-backup-dir: /var/backups/posthog

# --- Backups ----------------------------------------------------------------

posthog-backup-r2-bucket: posthog-backup
posthog-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
posthog-backup-r2-region: auto
posthog-backup-oncalendar: "*-*-* 02:30:00"
posthog-backup-retention-days: 7

# --- DigitalOcean -----------------------------------------------------------

digitalocean-region: ams3
digitalocean-size: s-4vcpu-8gb
digitalocean-image: ubuntu-24-04-x64

# The droplet is named after the profile (Compute Name Standard). Set
# digitalocean-name only when the account needs a different label.
# digitalocean-name: posthog-example

# The machine keypair (SSH Keypair Standard). Absent, the package generates and
# owns ~/.ssh/<profile> and registers it at DigitalOcean under the profile name;
# `ssh <profile>` then works through the managed ~/.ssh/config block. Supplying
# an existing account key id opts out, and the package touches no key material.
# digitalocean-ssh-keys: "58495393"

# No VPC ID or VPC desired-state key exists intentionally. At runtime the
# compute stage must discover and attach the account's default VPC for ams3.
# It must neither create a VPC nor persist a discovered UUID in this file.

digitalocean-ssh-sources:
  - 0.0.0.0/0
  - "::/0"
digitalocean-http-sources:
  - 0.0.0.0/0
  - "::/0"

# --- Vultr (provider-compute: vultr) ---------------------------------------
#
# vultr-region: ams
# vultr-plan: vc2-4c-8gb
# # Numeric OS id; 2284 is Ubuntu 24.04 LTS x64.
# vultr-os-id: 2284
# # The instance label defaults to the profile; the package never sets a Vultr
# # hostname, which is ForceNew.
# # vultr-name: posthog-example
# # Absent means the package generates and owns the machine key (see above).
# # vultr-ssh-keys: 00000000-0000-0000-0000-000000000000
# vultr-ssh-sources:
#   - 0.0.0.0/0
#   - "::/0"
# vultr-http-sources:
#   - 0.0.0.0/0
#   - "::/0"

# --- OpenTofu state ----------------------------------------------------------

r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
