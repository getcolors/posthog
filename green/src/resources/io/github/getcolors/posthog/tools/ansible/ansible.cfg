[defaults]
stdout_callback = default
interpreter_python = auto_silent
retry_files_enabled = False
<% if ssh-keygen %># Keygen mode: the deployment owns its key and nothing guarantees an agent
# holds it, so name it explicitly rather than relying on the operator's
# default identities.
private_key_file = <{ ssh-private-key-path }>
<% endif %>
[ssh_connection]
pipelining = True
