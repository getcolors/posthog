---
- name: Install production single-node PostHog
  hosts: posthog
  become: true
  gather_facts: false
  pre_tasks:
    - ansible.builtin.wait_for_connection: {connect_timeout: 10, delay: 5, sleep: 5, timeout: 600}
    - ansible.builtin.setup:
  tasks:
    - name: Install Docker and backup tooling
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, rclone, ca-certificates, curl]
        state: present
        # No cache_valid_time: a fresh droplet ships apt lists old enough to
        # name package versions the archive has already superseded, and the
        # install then fails on a 404 rather than fetching a current index.
        update_cache: true
    - ansible.builtin.systemd_service: {name: docker, enabled: true, state: started}
    - ansible.builtin.file: {path: /opt/posthog, state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "/var/lib/posthog/postgres", state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "/var/lib/posthog/clickhouse", state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "/var/lib/posthog/redis", state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "/var/lib/posthog/kafka", state: directory, mode: "0755", owner: "101", group: "101"}
    - ansible.builtin.file: {path: "/var/backups/posthog", state: directory, mode: "0700"}
    - ansible.builtin.file: {path: /var/lib/posthog/clickhouse-config.d, state: directory, mode: "0755"}
    # The replica host is published through system.clusters and dialled by the
    # web and worker containers, so it must be the compose service name: from
    # inside those containers 127.0.0.1 is themselves, and the connection is
    # refused. ClickHouse resolves its own service name too, so is_local still
    # holds.
    - name: Install ClickHouse clusters configuration
      register: clickhouse_clusters_config
      ansible.builtin.copy:
        dest: /var/lib/posthog/clickhouse-config.d/clusters.xml
        mode: "0644"
        content: |
          <clickhouse>
              <remote_servers>
                  <posthog>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </posthog>
                  <posthog_migrations>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </posthog_migrations>
                  <posthog_single_shard>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </posthog_single_shard>
                  <posthog_writable>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </posthog_writable>
                  <posthog_primary_replica>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </posthog_primary_replica>
                  <ai_events>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </ai_events>
                  <aux>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </aux>
                  <ops>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </ops>
                  <sessions>
                      <shard><replica><host>clickhouse</host><port>9000</port></replica></shard>
                  </sessions>
              </remote_servers>
          </clickhouse>
    # PostHog's migrate_clickhouse passes replicated=True unconditionally, so
    # every table it creates is a ReplicatedMergeTree and needs coordination
    # metadata -- without it the very first CREATE TABLE dies with "There is no
    # Zookeeper configuration in server config". A single node does not need a
    # separate ZooKeeper for that: ClickHouse Keeper runs embedded in the same
    # server. The macros supply the {shard}/{replica} substitutions the
    # replicated table paths are built from.
    - name: Install embedded ClickHouse Keeper configuration
      register: clickhouse_keeper_config
      ansible.builtin.copy:
        dest: /var/lib/posthog/clickhouse-config.d/keeper.xml
        mode: "0644"
        content: |
          <clickhouse>
              <keeper_server>
                  <tcp_port>9181</tcp_port>
                  <server_id>1</server_id>
                  <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
                  <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
                  <coordination_settings>
                      <operation_timeout_ms>10000</operation_timeout_ms>
                      <session_timeout_ms>30000</session_timeout_ms>
                      <raft_logs_level>warning</raft_logs_level>
                  </coordination_settings>
                  <raft_configuration>
                      <server>
                          <id>1</id>
                          <hostname>127.0.0.1</hostname>
                          <port>9234</port>
                      </server>
                  </raft_configuration>
              </keeper_server>
              <zookeeper>
                  <node>
                      <host>127.0.0.1</host>
                      <port>9181</port>
                  </node>
              </zookeeper>
              <!--
                  posthog/clickhouse/cluster.py selects hosts with
                  `getMacro('hostClusterType')` and `getMacro('hostClusterRole')`
                  and filters them as

                      (role in requested_roles or ALL in requested_roles)
                      and (type == workload or workload == DEFAULT)

                  so ALL is a wildcard on the requesting side, not the host
                  side: a node labelled "all" matches only callers that pass
                  ALL, while "data" matches both DATA and ALL. Upstream ships
                  these macros from its own deployment tooling rather than its
                  config.xml, so a single node has to declare them itself.
              -->
              <macros>
                  <shard>1</shard>
                  <replica>replica-1</replica>
                  <hostClusterType>online</hostClusterType>
                  <hostClusterRole>data</hostClusterRole>
              </macros>
          </clickhouse>
    # PostHog's Kafka engine tables reference their broker through named
    # collections rather than inline settings, and every one a migration names
    # must resolve or it fails with NAMED_COLLECTION_DOESNT_EXIST. Only six are
    # discoverable from settings; this is the full set from upstream's own
    # docker/clickhouse/config.d/default.xml.
    - name: Install ClickHouse named collections for Kafka
      register: clickhouse_named_collections
      ansible.builtin.copy:
        dest: /var/lib/posthog/clickhouse-config.d/named-collections.xml
        mode: "0644"
        content: |
          <clickhouse>
              <named_collections>
                  <msk_cluster>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </msk_cluster>
                  <warpstream_ingestion>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_ingestion>
                  <warpstream_calculated_events>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_calculated_events>
                  <warpstream_replay>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_replay>
                  <warpstream_shared>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_shared>
                  <warpstream_cyclotron>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_cyclotron>
                  <warpstream_logs>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_logs>
                  <warpstream_traces>
                      <kafka_broker_list>kafka:9092</kafka_broker_list>
                  </warpstream_traces>
              </named_collections>
          </clickhouse>
    - name: Install stack configuration
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - {src: Caddyfile, dest: /opt/posthog/Caddyfile}
        - {src: backup, dest: /usr/local/sbin/posthog-backup, mode: "0700"}
    - name: Require the application secrets the compose file interpolates
      ansible.builtin.assert:
        that:
          - lookup('env', 'COLORS_PAR_POSTHOG_SECRET_KEY') | length > 0
          - lookup('env', 'COLORS_PAR_POSTHOG_POSTGRES_PASSWORD') | length > 0
        fail_msg: >-
          COLORS_PAR_POSTHOG_SECRET_KEY and COLORS_PAR_POSTHOG_POSTGRES_PASSWORD
          must be set; this stack has no default credentials.
        quiet: true
    - name: Render the compose file with run-time credentials
      ansible.builtin.template:
        src: compose.yml
        dest: /opt/posthog/compose.yml
        mode: "0600"
      no_log: true
    - name: Install backup credentials outside generated and tracked files
      ansible.builtin.copy:
        dest: /etc/posthog-backup.env
        mode: "0600"
        content: |
          POSTHOG_BACKUP_R2_ACCESS_KEY_ID={{ lookup('env','COLORS_PAR_POSTHOG_BACKUP_R2_ACCESS_KEY_ID') }}
          POSTHOG_BACKUP_R2_SECRET_ACCESS_KEY={{ lookup('env','COLORS_PAR_POSTHOG_BACKUP_R2_SECRET_ACCESS_KEY') }}
      no_log: true
    - name: Install backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/posthog-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Consistent PostHog single-node backup
          Requires=docker.service
          After=docker.service
          [Service]
          Type=oneshot
          EnvironmentFile=/etc/posthog-backup.env
          ExecStart=/usr/local/sbin/posthog-backup
      notify: Reload systemd
    - name: Install backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/posthog-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily PostHog backup
          [Timer]
          OnCalendar=*-*-* 02:30:00
          Persistent=true
          RandomizedDelaySec=300
          [Install]
          WantedBy=timers.target
      notify: Reload systemd
    - ansible.builtin.meta: flush_handlers
    # Start the datastores alone. The application image migrates on startup, so
    # bringing `web` up before the explicit migration below puts two runners on
    # one schema and the loser dies on "relation already exists".
    - name: Start the datastores
      ansible.builtin.command: docker compose up -d db redis kafka clickhouse
      args: {chdir: /opt/posthog}
      register: compose_up
      changed_when: "'Created' in (compose_up.stdout + compose_up.stderr) or 'Recreated' in (compose_up.stdout + compose_up.stderr)"
    - ansible.builtin.systemd_service: {name: posthog-backup.timer, enabled: true, state: started}
    # A single-file bind mount is bound to the inode it resolved at start, and
    # ansible.builtin.copy replaces files by rename, so a changed config leaves
    # the container serving the old content indefinitely -- the host path looks
    # correct while the server disagrees. Recreating re-resolves the mount.
    # Ask the server what it actually loaded rather than trusting this run's
    # change flags: on a converge where the files were already correct, `copy`
    # reports no change while a container started before them keeps serving the
    # old config forever. The macro stands in for "has the current config".
    - name: Check whether ClickHouse loaded the current configuration
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, clickhouse, clickhouse-client, --query,
               "SELECT (SELECT count() FROM system.macros WHERE macro = 'hostClusterType') + (SELECT count() FROM system.named_collections WHERE name = 'msk_cluster')"]
      args: {chdir: /opt/posthog}
      register: clickhouse_macros
      changed_when: false
      failed_when: false
    - name: Reload ClickHouse when its configuration changed or is stale
      ansible.builtin.command: docker compose up -d --force-recreate clickhouse
      args: {chdir: /opt/posthog}
      when: >-
        clickhouse_clusters_config.changed or clickhouse_keeper_config.changed
        or clickhouse_named_collections.changed
        or (clickhouse_macros.stdout | default('') | trim) != '2'
    - name: Wait for ClickHouse to accept queries
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, clickhouse, clickhouse-client, --query, "SELECT 1"]
      args: {chdir: /opt/posthog}
      register: clickhouse_ready
      changed_when: false
      retries: 60
      delay: 5
      until: clickhouse_ready.rc == 0
    # System log tables are created on first write, so a freshly started server
    # has no system.crash_log -- and a PostHog migration builds a metrics view
    # over it, failing with "Unknown table expression identifier". Flushing the
    # logs materialises them before the migrations run.
    - name: Materialise the ClickHouse system log tables
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, clickhouse, clickhouse-client, --query, "SYSTEM FLUSH LOGS"]
      args: {chdir: /opt/posthog}
      changed_when: false
    - name: Wait for PostgreSQL to accept connections
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, db, pg_isready, -U, posthog]
      args: {chdir: /opt/posthog}
      register: db_ready
      changed_when: false
      retries: 60
      delay: 5
      until: db_ready.rc == 0
    - name: Apply PostgreSQL and ClickHouse migrations
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - run
          - --rm
          - --no-deps
          - -T
          - web
          - sh
          - -c
          - python manage.py migrate && python manage.py migrate_clickhouse
      args: {chdir: /opt/posthog}
      register: migrations
      changed_when: "'No migrations to apply' not in (migrations.stdout + migrations.stderr)"
    - name: Converge the application containers
      ansible.builtin.command: docker compose up -d --remove-orphans
      args: {chdir: /opt/posthog}
      register: app_up
      changed_when: "'Created' in (app_up.stdout + app_up.stderr) or 'Recreated' in (app_up.stdout + app_up.stderr)"
    - name: Wait for the PostHog web service to answer its health endpoint
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - web
          - python
          - -c
          - |
            import sys, urllib.request
            try:
                sys.exit(0 if urllib.request.urlopen(
                    "http://127.0.0.1:8000/_health/", timeout=5).status == 200 else 1)
            except Exception:
                sys.exit(1)
      args: {chdir: /opt/posthog}
      register: local_health
      changed_when: false
      retries: 60
      delay: 5
      until: local_health.rc == 0
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service: {daemon_reload: true}
